name: Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build for MC 1.21.11

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Load version-specific gradle.properties
        run: cp versions/1.21.11.properties gradle.properties

      - name: Patch Loom version in build.gradle
        run: |
          LOOM_VERSION=$(grep '^loom_version=' gradle.properties | cut -d'=' -f2)
          sed -i "s|id 'fabric-loom' version '[^']*'|id 'fabric-loom' version '${LOOM_VERSION}'|" build.gradle
          echo "Using Loom: $LOOM_VERSION"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-1.21.11-${{ hashFiles('versions/1.21.11.properties', 'build.gradle', 'settings.gradle') }}
          restore-keys: |
            gradle-1.21.11-

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x gradlew

      - name: Build mod
        run: ./gradlew build --stacktrace

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: kitmod-1.21.11
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
